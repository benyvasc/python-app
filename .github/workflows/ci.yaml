name: ci
on:
  push:
    # paths:
    #   - src /**
    branches:
      - master
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker Image
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push
        uses: docker/build-pucsh-action@v6
        with:
          push: true
          tags: benyvasc/python-app:${GITHUB_SHA::6}